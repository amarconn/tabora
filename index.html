<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>New Tab</title>

  <style>
    :root {
      --text: rgba(255, 255, 255, 0.96);
      --muted: rgba(255, 255, 255, 0.72);
      --soft: rgba(255, 255, 255, 0.16);
      --panel: rgba(12, 18, 32, 0.44);
      --panel-strong: rgba(12, 18, 32, 0.62);
      --border: rgba(255, 255, 255, 0.16);
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --blur: blur(18px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #0f172a;
    }

    body {
      position: relative;
    }

    .wallpaper,
    .overlay,
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .wallpaper {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.035);
      filter: saturate(1.08) contrast(1.04);
      transition: opacity 700ms ease;
      opacity: 0;
    }

    .wallpaper.is-ready {
      opacity: 1;
    }

    .overlay {
      background:
        radial-gradient(circle at top left, rgba(15, 23, 42, 0.20), transparent 42%),
        radial-gradient(circle at bottom right, rgba(15, 23, 42, 0.30), transparent 46%),
        linear-gradient(180deg, rgba(2, 6, 23, 0.42) 0%, rgba(2, 6, 23, 0.58) 100%);
    }

    .grain {
      opacity: 0.08;
      mix-blend-mode: soft-light;
      background-image:
        radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.8px),
        radial-gradient(rgba(255,255,255,0.65) 0.5px, transparent 0.8px);
      background-position: 0 0, 12px 12px;
      background-size: 24px 24px;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: min(1380px, calc(100vw - 56px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 430px;
      grid-template-rows: auto 1fr;
      gap: 24px;
      padding: 28px 0;
    }

    .glass {
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow: var(--shadow);
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .weather-card {
      min-height: 62px;
      min-width: 260px;
      max-width: min(420px, 56vw);
      padding: 14px 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .weather-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 1.65rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .weather-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .weather-city {
      font-size: 0.98rem;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weather-detail {
      font-size: 0.88rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wallpaper-pill {
      border: 1px solid var(--border);
      background: rgba(12, 18, 32, 0.32);
      color: var(--text);
      border-radius: 999px;
      height: 52px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
    }

    .wallpaper-pill:hover {
      transform: translateY(-1px);
      background: rgba(12, 18, 32, 0.48);
      border-color: rgba(255, 255, 255, 0.26);
    }

    .wallpaper-pill:active {
      transform: translateY(0);
    }

    .hero {
      grid-column: 1;
      grid-row: 2;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      padding: 24px 0 24px 6px;
    }

    .clock-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-shadow: 0 14px 42px rgba(0, 0, 0, 0.55);
    }

    .clock {
      font-size: clamp(5rem, 11vw, 9.5rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      color: rgba(255, 255, 255, 0.88);
      font-weight: 520;
      text-transform: capitalize;
      letter-spacing: 0.01em;
      margin-left: 8px;
    }

    .search-wrap {
      width: min(760px, 100%);
      padding: 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      font-size: 1.15rem;
    }

    .search-form {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      height: 48px;
      border: none;
      outline: none;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 1.08rem;
      padding: 0 12px 0 2px;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.70);
    }

    .search-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.64);
      font-size: 0.82rem;
      margin-left: 16px;
      padding-left: 18px;
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      white-space: nowrap;
    }

    .keycap {
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.08);
      font-size: 0.76rem;
      color: rgba(255,255,255,0.80);
    }

    .nba-panel {
      grid-column: 2;
      grid-row: 2;
      align-self: stretch;
      border-radius: var(--radius-xl);
      padding: 22px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .nba-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .nba-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nba-title h2 {
      margin: 0;
      font-size: 1.3rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .nba-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .refresh-mini {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      font: inherit;
      font-size: 1rem;
      transition: transform 160ms ease, background 160ms ease;
    }

    .refresh-mini:hover {
      transform: rotate(12deg);
      background: rgba(255,255,255,0.14);
    }

    .games {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 3px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .games::-webkit-scrollbar {
      width: 8px;
    }

    .games::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.20);
      border-radius: 999px;
    }

    .game-card,
    .state-card {
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.09);
      padding: 16px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .status-chip {
      max-width: 60%;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: #ef4444;
      box-shadow: 0 0 0 6px rgba(239,68,68,0.14);
    }

    .teams {
      display: grid;
      gap: 10px;
    }

    .team-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .team-name {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 640;
      line-height: 1.25;
    }

    .team-logo {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.28));
    }

    .team-logo-fallback {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      font-size: 1.2rem;
    }

    .team-full {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-score {
      font-size: 1.55rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      min-width: 2ch;
      text-align: right;
    }

    .muted-score {
      color: rgba(255,255,255,0.54);
    }

    .state-card {
      color: rgba(255,255,255,0.86);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .state-card strong {
      font-size: 1rem;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1120px) {
      html, body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        width: min(100%, calc(100vw - 32px));
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        padding: 18px 0 28px;
      }

      .topbar,
      .hero,
      .nba-panel {
        grid-column: 1;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .weather-card {
        min-width: 0;
        max-width: none;
        width: 100%;
      }

      .wallpaper-pill {
        width: fit-content;
      }

      .hero {
        grid-row: 2;
        padding: 10px 0;
      }

      .nba-panel {
        grid-row: 3;
        max-height: min(680px, 64vh);
      }

      .search-hint {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100%, calc(100vw - 24px));
      }

      .clock {
        font-size: clamp(4.1rem, 19vw, 6.5rem);
      }

      .date {
        margin-left: 4px;
      }

      .search-wrap {
        border-radius: 28px;
      }

      .team-full {
        white-space: normal;
      }

      .game-topline {
        align-items: flex-start;
        flex-direction: column;
      }

      .status-chip {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="overlay"></div>
  <div class="grain"></div>

  <main class="app">
    <header class="topbar">
      <section class="weather-card glass" aria-live="polite">
        <div class="weather-icon" id="weatherIcon">⌖</div>
        <div class="weather-copy">
          <div class="weather-city" id="weatherCity">Locating...</div>
          <div class="weather-detail" id="weatherDetail">Loading temperature</div>
        </div>
      </section>

      <button class="wallpaper-pill" id="wallpaperButton" type="button" title="Change wallpaper">
        <span aria-hidden="true">↻</span>
        <span>Change wallpaper</span>
      </button>
    </header>

    <section class="hero">
      <div class="clock-block">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">loading date...</div>
      </div>

      <div class="search-wrap glass">
        <div class="search-icon" aria-hidden="true">⌕</div>

        <form class="search-form" action="https://www.google.com/search" method="GET">
          <input
            class="search-input"
            id="searchInput"
            name="q"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search Google"
            aria-label="Search Google"
          />
        </form>

        <div class="search-hint" aria-hidden="true">
          <span class="keycap">/</span>
          <span>focus</span>
        </div>
      </div>
    </section>

    <aside class="nba-panel glass" aria-live="polite">
      <div class="nba-header">
        <div class="nba-title">
          <h2>NBA today</h2>
          <div class="nba-subtitle" id="nbaSubtitle">Loading games...</div>
        </div>

        <button class="refresh-mini" id="refreshGames" type="button" title="Refresh games">
          ↻
        </button>
      </div>

      <div class="games" id="games">
        <div class="state-card">
          <strong>Loading scores...</strong>
          <span>The internet is performing its usual ritual of making everything slower.</span>
        </div>
      </div>
    </aside>

  </main>

  <script>
    const elements = {
      wallpaper: document.getElementById("wallpaper"),
      wallpaperButton: document.getElementById("wallpaperButton"),
      clock: document.getElementById("clock"),
      date: document.getElementById("date"),
      searchInput: document.getElementById("searchInput"),
      weatherIcon: document.getElementById("weatherIcon"),
      weatherCity: document.getElementById("weatherCity"),
      weatherDetail: document.getElementById("weatherDetail"),
      games: document.getElementById("games"),
      nbaSubtitle: document.getElementById("nbaSubtitle"),
      refreshGames: document.getElementById("refreshGames")
    };

    const caches = {
      weather: "newtab_weather_cache_v1",
      city: "newtab_city_cache_v1"
    };

    // ==========
    // Wallpaper
    // ==========
    function loadWallpaper() {
      elements.wallpaper.classList.remove("is-ready");

      // Picsum returns a different random image whenever the URL changes.
      // This keeps the wallpaper fresh on each new tab.
      const url = `https://picsum.photos/1920/1080?random=${Date.now()}`;

      const image = new Image();
      image.onload = () => {
        elements.wallpaper.style.backgroundImage = `url("${url}")`;
        elements.wallpaper.classList.add("is-ready");
      };
      image.onerror = () => {
        elements.wallpaper.style.backgroundImage =
          "linear-gradient(135deg, #0f172a 0%, #1e293b 48%, #334155 100%)";
        elements.wallpaper.classList.add("is-ready");
      };
      image.src = url;
    }

    // =======
    // Clock
    // =======
    function capitalizeFirst(text) {
      return text ? text.charAt(0).toUpperCase() + text.slice(1) : text;
    }

    function updateClock() {
      const now = new Date();

      elements.clock.textContent = now.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      elements.date.textContent = capitalizeFirst(
        now.toLocaleDateString("en-US", {
          weekday: "long",
          day: "2-digit",
          month: "long"
        })
      );
    }

    // =====================
    // Keyboard shortcuts
    // =====================
    document.addEventListener("keydown", (event) => {
      if (event.key === "/" && document.activeElement !== elements.searchInput) {
        event.preventDefault();
        elements.searchInput.focus();
      }

      if (event.key === "Escape" && document.activeElement === elements.searchInput) {
        elements.searchInput.blur();
      }
    });

    // =======
    // Weather
    // =======
    function weatherCodeToPresentation(code, isDay = 1) {
      const presentation = {
        0: [isDay ? "☀️" : "🌙", "Clear sky"],
        1: [isDay ? "🌤️" : "☁️", "Mostly clear"],
        2: ["⛅", "Partly cloudy"],
        3: ["☁️", "Overcast"],
        45: ["🌫️", "Fog"],
        48: ["🌫️", "Fog"],
        51: ["🌦️", "Light drizzle"],
        53: ["🌦️", "Moderate drizzle"],
        55: ["🌧️", "Heavy drizzle"],
        56: ["🌧️", "Freezing drizzle"],
        57: ["🌧️", "Freezing drizzle"],
        61: ["🌧️", "Light rain"],
        63: ["🌧️", "Moderate rain"],
        65: ["🌧️", "Heavy rain"],
        66: ["🌧️", "Freezing rain"],
        67: ["🌧️", "Freezing rain"],
        71: ["🌨️", "Light snow"],
        73: ["🌨️", "Moderate snow"],
        75: ["❄️", "Heavy snow"],
        77: ["❄️", "Snow grains"],
        80: ["🌦️", "Rain showers"],
        81: ["🌧️", "Rain showers"],
        82: ["⛈️", "Heavy rain showers"],
        85: ["🌨️", "Snow showers"],
        86: ["🌨️", "Heavy snow showers"],
        95: ["⛈️", "Thunderstorm"],
        96: ["⛈️", "Thunderstorm with hail"],
        99: ["⛈️", "Thunderstorm with hail"]
      };

      return presentation[code] || ["🌡️", "Current conditions"];
    }

    function saveCache(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify({
          savedAt: Date.now(),
          value
        }));
      } catch (_) {}
    }

    function readCache(key, maxAgeMs) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;

        const parsed = JSON.parse(raw);
        if (!parsed?.savedAt || Date.now() - parsed.savedAt > maxAgeMs) return null;
        return parsed.value;
      } catch (_) {
        return null;
      }
    }

    function requestBrowserPosition() {
      return new Promise((resolve) => {
        if (!("geolocation" in navigator)) {
          resolve(null);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude
            });
          },
          () => resolve(null),
          {
            enableHighAccuracy: false,
            timeout: 7000,
            maximumAge: 30 * 60 * 1000
          }
        );
      });
    }

    async function resolveLocality(position) {
      const params = new URLSearchParams({
        localityLanguage: "en"
      });

      if (position?.latitude != null && position?.longitude != null) {
        params.set("latitude", position.latitude);
        params.set("longitude", position.longitude);
      }

      const response = await fetch(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?${params.toString()}`
      );

      if (!response.ok) {
        throw new Error(`Location unavailable (${response.status})`);
      }

      const data = await response.json();

      return {
        city: data.city || data.locality || "Your area",
        subdivision: data.principalSubdivision || "",
        latitude: data.latitude,
        longitude: data.longitude
      };
    }

    async function fetchCurrentWeather(latitude, longitude) {
      const params = new URLSearchParams({
        latitude,
        longitude,
        current: "temperature_2m,weather_code,is_day",
        timezone: "auto"
      });

      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?${params.toString()}`
      );

      if (!response.ok) {
        throw new Error(`Weather unavailable (${response.status})`);
      }

      const data = await response.json();

      return {
        temperature: data?.current?.temperature_2m,
        weatherCode: data?.current?.weather_code,
        isDay: data?.current?.is_day ?? 1
      };
    }

    function renderWeather(locality, weather) {
      const [icon, description] = weatherCodeToPresentation(
        Number(weather.weatherCode),
        Number(weather.isDay)
      );

      const cityText = locality.subdivision
        ? `${locality.city}, ${locality.subdivision}`
        : locality.city;

      const temperature =
        Number.isFinite(Number(weather.temperature))
          ? `${Math.round(Number(weather.temperature))}°C`
          : "--°C";

      elements.weatherIcon.textContent = icon;
      elements.weatherCity.textContent = cityText;
      elements.weatherDetail.textContent = `${temperature} • ${description}`;
    }

    function renderWeatherFallback(message = "Could not load weather") {
      elements.weatherIcon.textContent = "⌖";
      elements.weatherCity.textContent = "Location unavailable";
      elements.weatherDetail.textContent = message;
    }

    async function initWeather() {
      const cachedWeather = readCache(caches.weather, 15 * 60 * 1000);
      const cachedCity = readCache(caches.city, 24 * 60 * 60 * 1000);

      if (cachedWeather && cachedCity) {
        renderWeather(cachedCity, cachedWeather);
      }

      try {
        const browserPosition = await requestBrowserPosition();
        const locality = await resolveLocality(browserPosition);
        const weather = await fetchCurrentWeather(locality.latitude, locality.longitude);

        renderWeather(locality, weather);
        saveCache(caches.city, locality);
        saveCache(caches.weather, weather);
      } catch (error) {
        if (!(cachedWeather && cachedCity)) {
          renderWeatherFallback("Allow location access or try again later");
        }
        console.warn("Failed to load weather:", error);
      }
    }

    // ==========
    // NBA scores
    // ==========
    function formatTodayYYYYMMDD() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      return `${yyyy}${mm}${dd}`;
    }

    function formatLocalTime(dateValue) {
      if (!dateValue) return "Time to be confirmed";

      const date = new Date(dateValue);
      if (Number.isNaN(date.getTime())) return "Time to be confirmed";

      return date.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        timeZoneName: "short"
      });
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeESPNGame(event) {
      const competition = event?.competitions?.[0];
      const competitors = competition?.competitors || [];

      const home = competitors.find((team) => team.homeAway === "home") || {};
      const away = competitors.find((team) => team.homeAway === "away") || {};

      const statusType = event?.status?.type || {};
      const state = statusType.state || "pre";
      const detail = statusType.shortDetail || statusType.detail || statusType.description || "Scheduled";

      return {
        awayName: away?.team?.displayName || away?.team?.shortDisplayName || "Away team",
        awayCode: away?.team?.abbreviation || "",
        awayLogo: away?.team?.logo || "",
        awayScore: away?.score ?? "",
        homeName: home?.team?.displayName || home?.team?.shortDisplayName || "Home team",
        homeCode: home?.team?.abbreviation || "",
        homeLogo: home?.team?.logo || "",
        homeScore: home?.score ?? "",
        status: detail,
        state,
        timeUTC: event?.date || null
      };
    }

    function getOfficialNBALogoUrl(teamId) {
      return teamId
        ? `https://cdn.nba.com/logos/nba/${teamId}/primary/L/logo.svg`
        : "";
    }

    function normalizeNBACdnGame(game) {
      const text = game?.gameStatusText || "Scheduled";
      const lower = text.toLowerCase();

      let state = "pre";
      if (lower.includes("final")) state = "post";
      if (
        lower.includes("qtr") ||
        lower.includes("quarter") ||
        lower.includes("halftime") ||
        lower.includes("live") ||
        game?.gameStatus === 2
      ) {
        state = "in";
      }

      return {
        awayName: [game?.awayTeam?.teamCity, game?.awayTeam?.teamName].filter(Boolean).join(" ") || "Away team",
        awayCode: game?.awayTeam?.teamTricode || "",
        awayScore: game?.awayTeam?.score ?? "",
        homeName: [game?.homeTeam?.teamCity, game?.homeTeam?.teamName].filter(Boolean).join(" ") || "Home team",
        homeCode: game?.homeTeam?.teamTricode || "",
        homeScore: game?.homeTeam?.score ?? "",
        status: text,
        state,
        timeUTC: game?.gameTimeUTC || null
      };
    }

    async function fetchGamesFromESPN() {
      const date = formatTodayYYYYMMDD();
      const response = await fetch(
        `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${date}`
      );

      if (!response.ok) {
        throw new Error(`ESPN respondeu ${response.status}`);
      }

      const data = await response.json();
      const events = Array.isArray(data?.events) ? data.events : [];

      return events.map(normalizeESPNGame);
    }

    async function fetchGamesFromNBACdn() {
      const response = await fetch(
        "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json"
      );

      if (!response.ok) {
        throw new Error(`NBA respondeu ${response.status}`);
      }

      const data = await response.json();
      const games = Array.isArray(data?.scoreboard?.games) ? data.scoreboard.games : [];

      return games.map(normalizeNBACdnGame);
    }

    function scoreDisplay(score) {
      if (score === "" || score == null) {
        return `<span class="muted-score">—</span>`;
      }
      return escapeHTML(score);
    }

    function logoMarkup(url, teamName) {
      if (!url) {
        return `<span class="team-logo-fallback" aria-hidden="true">🏀</span>`;
      }

      return `<img
        class="team-logo"
        src="${escapeHTML(url)}"
        alt="${escapeHTML(teamName)} logo"
        loading="lazy"
        referrerpolicy="no-referrer"
      />`;
    }

    function renderGames(games) {
      if (!Array.isArray(games) || games.length === 0) {
        elements.nbaSubtitle.textContent = "No games found for today";
        elements.games.innerHTML = `
          <div class="state-card">
            <strong>No NBA games today.</strong>
            <span>At least the players get a day off. Humanity rarely does.</span>
          </div>
        `;
        return;
      }

      games.sort((a, b) => {
        const ta = a.timeUTC ? new Date(a.timeUTC).getTime() : Number.MAX_SAFE_INTEGER;
        const tb = b.timeUTC ? new Date(b.timeUTC).getTime() : Number.MAX_SAFE_INTEGER;
        return ta - tb;
      });

      elements.nbaSubtitle.textContent =
        games.length === 1 ? "1 game found" : `${games.length} games found`;

      elements.games.innerHTML = games.map((game) => {
        const isLive = game.state === "in";
        const topTime =
          game.state === "pre"
            ? formatLocalTime(game.timeUTC)
            : game.state === "post"
              ? "Final"
              : "Live";

        return `
          <article class="game-card">
            <div class="game-topline">
              <span>${escapeHTML(topTime)}</span>
              <span class="status-chip" title="${escapeHTML(game.status)}">
                ${isLive ? '<span class="live-dot" aria-hidden="true"></span>' : ""}
                ${escapeHTML(game.status)}
              </span>
            </div>

            <div class="teams">
              <div class="team-row">
                <div class="team-name">
                  ${logoMarkup(game.awayLogo, game.awayName)}
                  <span class="team-full">${escapeHTML(game.awayName)}</span>
                </div>
                <div class="team-score">${scoreDisplay(game.awayScore)}</div>
              </div>

              <div class="team-row">
                <div class="team-name">
                  ${logoMarkup(game.homeLogo, game.homeName)}
                  <span class="team-full">${escapeHTML(game.homeName)}</span>
                </div>
                <div class="team-score">${scoreDisplay(game.homeScore)}</div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderGamesError() {
      elements.nbaSubtitle.textContent = "Scores are unavailable right now";
      elements.games.innerHTML = `
        <div class="state-card">
          <strong>Could not load the games right now.</strong>
          <span>Refresh again in a moment. The layout is ready; the APIs occasionally decide to behave like fog.</span>
        </div>
      `;
    }

    async function loadNBAGames() {
      elements.nbaSubtitle.textContent = "Refreshing scores...";
      elements.games.innerHTML = `
        <div class="state-card">
          <strong>Loading scores...</strong>
          <span>Checking available sources.</span>
        </div>
      `;

      try {
        const espnGames = await fetchGamesFromESPN();
        renderGames(espnGames);
        return;
      } catch (espnError) {
        console.warn("ESPN source failed:", espnError);
      }

      try {
        const nbaGames = await fetchGamesFromNBACdn();
        renderGames(nbaGames);
        return;
      } catch (nbaError) {
        console.warn("NBA CDN source failed:", nbaError);
      }

      renderGamesError();
    }

    // ============
    // Initialization
    // ============
    loadWallpaper();
    updateClock();
    initWeather();
    loadNBAGames();

    setInterval(updateClock, 1000);
    setInterval(loadNBAGames, 60 * 1000);

    elements.wallpaperButton.addEventListener("click", loadWallpaper);
    elements.refreshGames.addEventListener("click", loadNBAGames);
  </script>
</body>
</html>
