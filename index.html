<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Tabora</title>

  <style>
    :root {
      --text: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.70);
      --panel: rgba(15,23,42,.50);
      --panel-soft: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.16);
      --shadow: 0 24px 80px rgba(0,0,0,.42);
      --blur: blur(18px);
      --radius-xl: 30px;
      --radius-md: 20px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #0f172a;
    }

    .wallpaper, .overlay, .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .wallpaper {
      background-size: cover;
      background-position: center;
      transform: scale(1.035);
      filter: saturate(1.08) contrast(1.04);
      opacity: 0;
      transition: opacity 700ms ease;
    }

    .wallpaper.ready { opacity: 1; }

    .overlay {
      background:
        radial-gradient(circle at top left, rgba(15,23,42,.12), transparent 42%),
        radial-gradient(circle at bottom right, rgba(15,23,42,.28), transparent 46%),
        linear-gradient(180deg, rgba(2,6,23,.42), rgba(2,6,23,.62));
    }

    .grain {
      opacity: .07;
      mix-blend-mode: soft-light;
      background-image: radial-gradient(rgba(255,255,255,.9) .5px, transparent .8px);
      background-size: 22px 22px;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      width: min(1380px, calc(100vw - 56px));
      margin: 0 auto;
      padding: 28px 0;
      display: grid;
      grid-template-columns: minmax(520px, 1fr) 430px;
      grid-template-rows: auto 1fr;
      gap: 24px;
    }

    .glass {
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow: var(--shadow);
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .weather {
      min-height: 62px;
      min-width: 260px;
      max-width: min(430px, 56vw);
      padding: 14px 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .weather-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.12);
      font-size: 1.6rem;
      flex: 0 0 auto;
    }

    .weather-city {
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weather-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: .88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wallpaper-btn {
      height: 52px;
      border: 1px solid var(--border);
      background: rgba(12,18,32,.34);
      color: var(--text);
      border-radius: 999px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow: 0 16px 40px rgba(0,0,0,.25);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .wallpaper-btn:hover {
      transform: translateY(-1px);
      background: rgba(12,18,32,.48);
      border-color: rgba(255,255,255,.26);
    }

    .hero {
      grid-column: 1;
      grid-row: 2;
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding-left: 6px;
    }

    .clock {
      font-size: clamp(5rem, 11vw, 9.5rem);
      line-height: .92;
      letter-spacing: -.07em;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 14px 42px rgba(0,0,0,.55);
    }

    .date {
      margin-left: 8px;
      margin-top: 8px;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      color: rgba(255,255,255,.88);
      font-weight: 520;
      text-transform: capitalize;
      text-shadow: 0 14px 42px rgba(0,0,0,.55);
    }

    .search {
      width: min(760px, 100%);
      padding: 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.10);
      font-size: 1.15rem;
      flex: 0 0 auto;
    }

    .search form { width: 100%; }

    .search input {
      width: 100%;
      height: 48px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 1.08rem;
    }

    .search input::placeholder { color: rgba(255,255,255,.70); }

    .hint {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: rgba(255,255,255,.64);
      font-size: .82rem;
      padding-left: 18px;
      border-left: 1px solid rgba(255,255,255,.14);
      white-space: nowrap;
    }

    .keycap {
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.20);
      background: rgba(255,255,255,.08);
      font-size: .76rem;
    }

    .right-column {
      grid-column: 2;
      grid-row: 2;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      min-height: 0;
    }
    
    .nba-panel {
      width: 100%;
      min-height: 0;
      border-radius: var(--radius-xl);
      padding: 22px;
      display: flex;
      flex-direction: column;
    }

    .nba-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .nba-title h2 {
      margin: 0;
      font-size: 1.3rem;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .nba-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: .9rem;
    }

    .refresh {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      font: inherit;
      font-size: 1rem;
      transition: transform 160ms ease, background 160ms ease;
    }

    .refresh:hover {
      transform: rotate(12deg);
      background: rgba(255,255,255,.14);
    }

    .games {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-right: 3px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .games::-webkit-scrollbar { width: 8px; }
    .games::-webkit-scrollbar-thumb { background: rgba(255,255,255,.20); border-radius: 999px; }

    .game-card, .state-card {
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,.14);
      background: var(--panel-soft);
      padding: 16px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: .84rem;
    }

    .status-chip {
      max-width: 62%;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 6px rgba(239,68,68,.14);
    }

    .teams {
      display: grid;
      gap: 10px;
    }

    .team-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .team-name {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      line-height: 1.25;
    }

    .team-logo, .team-logo-fallback {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
    }

    .team-logo {
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.28));
    }

    .team-logo-fallback {
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
    }

    .team-full {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-score {
      min-width: 2ch;
      text-align: right;
      font-size: 1.55rem;
      font-weight: 730;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.03em;
    }

    .muted-score { color: rgba(255,255,255,.54); }

    .state-card {
      color: rgba(255,255,255,.86);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .custom-image-section {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .custom-image-frame {
      width: 270px;
      height: 270px;
      border: 1px dashed rgba(255,255,255,.32);
      background: rgba(255,255,255,.08);
      color: rgba(255,255,255,.78);
      border-radius: 22px;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
      cursor: pointer;
      padding: 0;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .custom-image-frame:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.46);
    }

    .custom-image-frame.has-image {
      border: none;
      background: transparent;
    }

    .custom-image-frame.has-image:hover { background: transparent; }

    .custom-image-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .custom-image-placeholder {
      font-size: 2.8rem;
      line-height: 1;
      font-weight: 300;
      user-select: none;
      pointer-events: none;
    }

    .custom-image-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 50%;
      background: rgba(0,0,0,.54);
      color: rgba(255,255,255,.94);
      display: grid;
      place-items: center;
      cursor: pointer;
      font: inherit;
      font-size: 1rem;
      line-height: 1;
      opacity: 0;
      transform: scale(.92);
      transition: opacity 140ms ease, transform 140ms ease, background 140ms ease;
      z-index: 2;
    }

    .custom-image-frame.has-image:hover .custom-image-remove,
    .custom-image-remove:focus-visible {
      opacity: 1;
      transform: scale(1);
    }

    .custom-image-remove:hover { background: rgba(0,0,0,.72); }
    .hidden { display: none !important; }

    @media (max-width: 1120px) {
      html, body { overflow: auto; }

      .app {
        height: auto;
        min-height: 100vh;
        width: min(100%, calc(100vw - 32px));
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        padding: 18px 0 28px;
      }

      .topbar, .hero, .right-column { grid-column: 1; }
      .topbar { align-items: stretch; flex-direction: column; }
      .weather { min-width: 0; max-width: none; width: 100%; }
      .wallpaper-btn { width: fit-content; }
      .hero { grid-row: 2; padding: 10px 0; }
      .right-column {
        grid-row: 3;
        width: 100%;
      }
      
      .nba-panel {
        max-height: min(680px, 64vh);
      }
      .hint { display: none; }
    }

    @media (max-width: 640px) {
      .app { width: min(100%, calc(100vw - 24px)); }
      .clock { font-size: clamp(4.1rem, 19vw, 6.5rem); }
      .search { border-radius: 28px; }
      .team-full { white-space: normal; }
      .game-topline { align-items: flex-start; flex-direction: column; }
      .status-chip { max-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="overlay"></div>
  <div class="grain"></div>

  <main class="app">
    <header class="topbar">
      <section class="weather glass" aria-live="polite">
        <div class="weather-icon" id="weatherIcon">⌖</div>
        <div>
          <div class="weather-city" id="weatherCity">Locating...</div>
          <div class="weather-detail" id="weatherDetail">Loading temperature</div>
        </div>
      </section>

      <button class="wallpaper-btn" id="wallpaperButton" type="button" title="Change wallpaper">
        <span aria-hidden="true">↻</span>
        <span>Change wallpaper</span>
      </button>
    </header>

    <section class="hero">
      <div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">loading date...</div>
      </div>

      <div class="search glass">
        <div class="search-icon" aria-hidden="true">⌕</div>
        <form action="https://www.google.com/search" method="GET">
          <input id="searchInput" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search Google" aria-label="Search Google" />
        </form>
        <div class="hint" aria-hidden="true"><span class="keycap">/</span><span>focus</span></div>
      </div>
    </section>

    <div class="right-column">
      <aside class="nba-panel glass" aria-live="polite">
        <div class="nba-header">
          <div class="nba-title">
            <h2>NBA today</h2>
            <div class="nba-subtitle" id="nbaSubtitle">Loading games...</div>
          </div>
    
          <button class="refresh" id="refreshGames" type="button" title="Refresh games">
            ↻
          </button>
        </div>
    
        <div class="games" id="games">
          <div class="state-card">
            <strong>Loading scores...</strong>
            <span>Checking available sources.</span>
          </div>
        </div>
      </aside>
    
      <section class="custom-image-section" aria-label="Custom local image">
        <div
          class="custom-image-frame"
          id="customImageFrame"
          role="button"
          tabindex="0"
          aria-label="Choose custom image"
        >
          <img
            id="customImagePreview"
            class="custom-image-preview hidden"
            alt="Custom user image"
          />
    
          <span
            id="customImagePlaceholder"
            class="custom-image-placeholder"
            aria-hidden="true"
          >
            +
          </span>
    
          <button
            class="custom-image-remove hidden"
            id="removeCustomImage"
            type="button"
            aria-label="Remove custom image"
            title="Remove custom image"
          >
            ×
          </button>
        </div>
    
        <input
          id="customImageInput"
          type="file"
          accept="image/png, image/jpeg, image/webp, image/gif"
          hidden
        />
      </section>
    </div>
  </main>

  <script>
    const elements = {
      wallpaper: document.getElementById("wallpaper"),
      wallpaperButton: document.getElementById("wallpaperButton"),
      clock: document.getElementById("clock"),
      date: document.getElementById("date"),
      searchInput: document.getElementById("searchInput"),
      weatherIcon: document.getElementById("weatherIcon"),
      weatherCity: document.getElementById("weatherCity"),
      weatherDetail: document.getElementById("weatherDetail"),
      games: document.getElementById("games"),
      nbaSubtitle: document.getElementById("nbaSubtitle"),
      refreshGames: document.getElementById("refreshGames"),
      customImageFrame: document.getElementById("customImageFrame"),
      customImagePreview: document.getElementById("customImagePreview"),
      customImagePlaceholder: document.getElementById("customImagePlaceholder"),
      removeCustomImage: document.getElementById("removeCustomImage"),
      customImageInput: document.getElementById("customImageInput")
    };

    const caches = {
      city: "tabora_city_cache_v1",
      weather: "tabora_weather_cache_v1"
    };

    function loadWallpaper() {
      elements.wallpaper.classList.remove("ready");
      const url = `https://picsum.photos/1920/1080?random=${Date.now()}`;
      const img = new Image();

      img.onload = () => {
        elements.wallpaper.style.backgroundImage = `url("${url}")`;
        elements.wallpaper.classList.add("ready");
      };

      img.onerror = () => {
        elements.wallpaper.style.backgroundImage = "linear-gradient(135deg, #0f172a, #1e293b, #334155)";
        elements.wallpaper.classList.add("ready");
      };

      img.src = url;
    }

    function updateClock() {
      const now = new Date();

      elements.clock.textContent = now.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      const dateText = now.toLocaleDateString("en-US", {
        weekday: "long",
        day: "2-digit",
        month: "long"
      });

      elements.date.textContent = dateText.charAt(0).toUpperCase() + dateText.slice(1);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "/" && document.activeElement !== elements.searchInput) {
        event.preventDefault();
        elements.searchInput.focus();
      }

      if (event.key === "Escape" && document.activeElement === elements.searchInput) {
        elements.searchInput.blur();
      }
    });

    function saveCache(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), value }));
      } catch (_) {}
    }

    function readCache(key, maxAgeMs) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed?.savedAt || Date.now() - parsed.savedAt > maxAgeMs) return null;
        return parsed.value;
      } catch (_) {
        return null;
      }
    }

    function weatherCode(code, isDay = 1) {
      const data = {
        0: [isDay ? "☀️" : "🌙", "Clear sky"],
        1: [isDay ? "🌤️" : "☁️", "Mostly clear"],
        2: ["⛅", "Partly cloudy"],
        3: ["☁️", "Overcast"],
        45: ["🌫️", "Fog"],
        48: ["🌫️", "Fog"],
        51: ["🌦️", "Light drizzle"],
        53: ["🌦️", "Moderate drizzle"],
        55: ["🌧️", "Heavy drizzle"],
        61: ["🌧️", "Light rain"],
        63: ["🌧️", "Moderate rain"],
        65: ["🌧️", "Heavy rain"],
        71: ["🌨️", "Light snow"],
        73: ["🌨️", "Moderate snow"],
        75: ["❄️", "Heavy snow"],
        80: ["🌦️", "Rain showers"],
        81: ["🌧️", "Rain showers"],
        82: ["⛈️", "Heavy rain showers"],
        95: ["⛈️", "Thunderstorm"],
        96: ["⛈️", "Thunderstorm with hail"],
        99: ["⛈️", "Thunderstorm with hail"]
      };

      return data[code] || ["🌡️", "Current conditions"];
    }

    function requestPosition() {
      return new Promise((resolve) => {
        if (!("geolocation" in navigator)) return resolve(null);

        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
          () => resolve(null),
          { enableHighAccuracy: false, timeout: 7000, maximumAge: 30 * 60 * 1000 }
        );
      });
    }

    async function resolveLocality(position) {
      const params = new URLSearchParams({ localityLanguage: "en" });

      if (position?.latitude != null && position?.longitude != null) {
        params.set("latitude", position.latitude);
        params.set("longitude", position.longitude);
      }

      const response = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?${params.toString()}`);
      if (!response.ok) throw new Error(`Location unavailable (${response.status})`);

      const data = await response.json();

      return {
        city: data.city || data.locality || "Your area",
        subdivision: data.principalSubdivision || "",
        latitude: data.latitude,
        longitude: data.longitude
      };
    }

    async function fetchWeather(latitude, longitude) {
      const params = new URLSearchParams({
        latitude,
        longitude,
        current: "temperature_2m,weather_code,is_day",
        timezone: "auto"
      });

      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
      if (!response.ok) throw new Error(`Weather unavailable (${response.status})`);

      const data = await response.json();

      return {
        temperature: data?.current?.temperature_2m,
        weatherCode: data?.current?.weather_code,
        isDay: data?.current?.is_day ?? 1
      };
    }

    function renderWeather(locality, weather) {
      const [icon, description] = weatherCode(Number(weather.weatherCode), Number(weather.isDay));
      const city = locality.subdivision ? `${locality.city}, ${locality.subdivision}` : locality.city;
      const temp = Number.isFinite(Number(weather.temperature)) ? `${Math.round(Number(weather.temperature))}°C` : "--°C";

      elements.weatherIcon.textContent = icon;
      elements.weatherCity.textContent = city;
      elements.weatherDetail.textContent = `${temp} • ${description}`;
    }

    async function initWeather() {
      const cachedCity = readCache(caches.city, 24 * 60 * 60 * 1000);
      const cachedWeather = readCache(caches.weather, 15 * 60 * 1000);

      if (cachedCity && cachedWeather) renderWeather(cachedCity, cachedWeather);

      try {
        const position = await requestPosition();
        const locality = await resolveLocality(position);
        const weather = await fetchWeather(locality.latitude, locality.longitude);

        renderWeather(locality, weather);
        saveCache(caches.city, locality);
        saveCache(caches.weather, weather);
      } catch (error) {
        if (!(cachedCity && cachedWeather)) {
          elements.weatherIcon.textContent = "⌖";
          elements.weatherCity.textContent = "Location unavailable";
          elements.weatherDetail.textContent = "Allow location access or try again later";
        }
        console.warn("Failed to load weather:", error);
      }
    }

    function todayYYYYMMDD() {
      const now = new Date();
      return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatLocalTime(value) {
      if (!value) return "Time to be confirmed";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Time to be confirmed";

      return date.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        timeZoneName: "short"
      });
    }

    function normalizeESPNGame(event) {
      const competition = event?.competitions?.[0];
      const competitors = competition?.competitors || [];
      const home = competitors.find((team) => team.homeAway === "home") || {};
      const away = competitors.find((team) => team.homeAway === "away") || {};
      const status = event?.status?.type || {};

      return {
        awayName: away?.team?.displayName || away?.team?.shortDisplayName || "Away team",
        awayLogo: away?.team?.logo || "",
        awayScore: away?.score ?? "",
        homeName: home?.team?.displayName || home?.team?.shortDisplayName || "Home team",
        homeLogo: home?.team?.logo || "",
        homeScore: home?.score ?? "",
        status: status.shortDetail || status.detail || status.description || "Scheduled",
        state: status.state || "pre",
        timeUTC: event?.date || null
      };
    }

    function officialNBALogo(teamId) {
      return teamId ? `https://cdn.nba.com/logos/nba/${teamId}/primary/L/logo.svg` : "";
    }

    function normalizeNBACdnGame(game) {
      const text = game?.gameStatusText || "Scheduled";
      const lower = text.toLowerCase();
      let state = "pre";
      if (lower.includes("final")) state = "post";
      if (lower.includes("qtr") || lower.includes("quarter") || lower.includes("halftime") || game?.gameStatus === 2) state = "in";

      return {
        awayName: [game?.awayTeam?.teamCity, game?.awayTeam?.teamName].filter(Boolean).join(" ") || "Away team",
        awayLogo: officialNBALogo(game?.awayTeam?.teamId),
        awayScore: game?.awayTeam?.score ?? "",
        homeName: [game?.homeTeam?.teamCity, game?.homeTeam?.teamName].filter(Boolean).join(" ") || "Home team",
        homeLogo: officialNBALogo(game?.homeTeam?.teamId),
        homeScore: game?.homeTeam?.score ?? "",
        status: text,
        state,
        timeUTC: game?.gameTimeUTC || null
      };
    }

    async function fetchGamesFromESPN() {
      const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${todayYYYYMMDD()}`);
      if (!response.ok) throw new Error(`ESPN returned ${response.status}`);
      const data = await response.json();
      return (Array.isArray(data?.events) ? data.events : []).map(normalizeESPNGame);
    }

    async function fetchGamesFromNBACdn() {
      const response = await fetch("https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json");
      if (!response.ok) throw new Error(`NBA returned ${response.status}`);
      const data = await response.json();
      return (Array.isArray(data?.scoreboard?.games) ? data.scoreboard.games : []).map(normalizeNBACdnGame);
    }

    function logoMarkup(url, name) {
      if (!url) return `<span class="team-logo-fallback" aria-hidden="true">🏀</span>`;
      return `<img class="team-logo" src="${escapeHTML(url)}" alt="${escapeHTML(name)} logo" loading="lazy" referrerpolicy="no-referrer" />`;
    }

    function scoreMarkup(score) {
      if (score === "" || score == null) return `<span class="muted-score">—</span>`;
      return escapeHTML(score);
    }

    function renderGames(games) {
      if (!Array.isArray(games) || games.length === 0) {
        elements.nbaSubtitle.textContent = "No games found for today";
        elements.games.innerHTML = `
          <div class="state-card">
            <strong>No NBA games today.</strong>
            <span>At least the players get a day off.</span>
          </div>`;
        return;
      }

      games.sort((a, b) => {
        const ta = a.timeUTC ? new Date(a.timeUTC).getTime() : Number.MAX_SAFE_INTEGER;
        const tb = b.timeUTC ? new Date(b.timeUTC).getTime() : Number.MAX_SAFE_INTEGER;
        return ta - tb;
      });

      elements.nbaSubtitle.textContent = games.length === 1 ? "1 game found" : `${games.length} games found`;

      elements.games.innerHTML = games.map((game) => {
        const isLive = game.state === "in";
        const leftTime = game.state === "pre" ? formatLocalTime(game.timeUTC) : game.state === "post" ? "Final" : "Live";

        return `
          <article class="game-card">
            <div class="game-topline">
              <span>${escapeHTML(leftTime)}</span>
              <span class="status-chip" title="${escapeHTML(game.status)}">
                ${isLive ? '<span class="live-dot" aria-hidden="true"></span>' : ""}
                ${escapeHTML(game.status)}
              </span>
            </div>

            <div class="teams">
              <div class="team-row">
                <div class="team-name">
                  ${logoMarkup(game.awayLogo, game.awayName)}
                  <span class="team-full">${escapeHTML(game.awayName)}</span>
                </div>
                <div class="team-score">${scoreMarkup(game.awayScore)}</div>
              </div>

              <div class="team-row">
                <div class="team-name">
                  ${logoMarkup(game.homeLogo, game.homeName)}
                  <span class="team-full">${escapeHTML(game.homeName)}</span>
                </div>
                <div class="team-score">${scoreMarkup(game.homeScore)}</div>
              </div>
            </div>
          </article>`;
      }).join("");
    }

    async function loadNBAGames() {
      elements.nbaSubtitle.textContent = "Refreshing scores...";
      elements.games.innerHTML = `<div class="state-card"><strong>Loading scores...</strong><span>Checking available sources.</span></div>`;

      try {
        renderGames(await fetchGamesFromESPN());
        return;
      } catch (error) {
        console.warn("ESPN source failed:", error);
      }

      try {
        renderGames(await fetchGamesFromNBACdn());
        return;
      } catch (error) {
        console.warn("NBA CDN source failed:", error);
      }

      elements.nbaSubtitle.textContent = "Scores are unavailable right now";
      elements.games.innerHTML = `<div class="state-card"><strong>Could not load the games right now.</strong><span>Refresh again in a moment.</span></div>`;
    }

    const customImageDB = {
      name: "tabora_custom_image_db",
      version: 1,
      store: "images",
      key: "main_custom_image"
    };

    let customImageObjectUrl = null;

    function openCustomImageDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(customImageDB.name, customImageDB.version);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(customImageDB.store)) {
            db.createObjectStore(customImageDB.store, { keyPath: "id" });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveCustomImage(file) {
      const db = await openCustomImageDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(customImageDB.store, "readwrite");
        const store = transaction.objectStore(customImageDB.store);
        store.put({ id: customImageDB.key, blob: file, name: file.name, type: file.type, updatedAt: Date.now() });

        transaction.oncomplete = () => { db.close(); resolve(); };
        transaction.onerror = () => { db.close(); reject(transaction.error); };
      });
    }

    async function loadCustomImage() {
      const db = await openCustomImageDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(customImageDB.store, "readonly");
        const request = transaction.objectStore(customImageDB.store).get(customImageDB.key);

        request.onsuccess = () => { db.close(); resolve(request.result || null); };
        request.onerror = () => { db.close(); reject(request.error); };
      });
    }

    async function deleteCustomImage() {
      const db = await openCustomImageDB();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(customImageDB.store, "readwrite");
        transaction.objectStore(customImageDB.store).delete(customImageDB.key);

        transaction.oncomplete = () => { db.close(); resolve(); };
        transaction.onerror = () => { db.close(); reject(transaction.error); };
      });
    }

    function showCustomImage(record) {
      if (customImageObjectUrl) {
        URL.revokeObjectURL(customImageObjectUrl);
        customImageObjectUrl = null;
      }

      if (!record?.blob) {
        elements.customImageFrame.classList.remove("has-image");
        elements.customImagePreview.classList.add("hidden");
        elements.customImagePreview.removeAttribute("src");
        elements.customImagePlaceholder.classList.remove("hidden");
        elements.removeCustomImage.classList.add("hidden");
        return;
      }

      customImageObjectUrl = URL.createObjectURL(record.blob);
      elements.customImageFrame.classList.add("has-image");
      elements.customImagePreview.src = customImageObjectUrl;
      elements.customImagePreview.classList.remove("hidden");
      elements.customImagePlaceholder.classList.add("hidden");
      elements.removeCustomImage.classList.remove("hidden");
    }

    async function handleCustomImageFile(file) {
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Please choose a valid image file.");
        return;
      }

      const maxSizeMB = 12;
      if (file.size > maxSizeMB * 1024 * 1024) {
        alert(`Please choose an image smaller than ${maxSizeMB} MB.`);
        return;
      }

      try {
        await saveCustomImage(file);
        showCustomImage(await loadCustomImage());
      } catch (error) {
        console.error("Could not save custom image:", error);
        alert("Could not save this image in the browser.");
      }
    }

    async function initCustomImage() {
      try {
        showCustomImage(await loadCustomImage());
      } catch (error) {
        console.warn("Could not load custom image:", error);
      }

      elements.customImageFrame.addEventListener("click", () => elements.customImageInput.click());

      elements.customImageFrame.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          elements.customImageInput.click();
        }
      });

      elements.customImageInput.addEventListener("change", async () => {
        await handleCustomImageFile(elements.customImageInput.files?.[0]);
        elements.customImageInput.value = "";
      });

      elements.removeCustomImage.addEventListener("click", async (event) => {
        event.stopPropagation();

        try {
          await deleteCustomImage();
          showCustomImage(null);
        } catch (error) {
          console.error("Could not remove custom image:", error);
          alert("Could not remove the image.");
        }
      });
    }

    loadWallpaper();
    updateClock();
    initWeather();
    loadNBAGames();
    initCustomImage();

    setInterval(updateClock, 1000);
    setInterval(loadNBAGames, 60 * 1000);

    elements.wallpaperButton.addEventListener("click", loadWallpaper);
    elements.refreshGames.addEventListener("click", loadNBAGames);
  </script>
</body>
</html>
